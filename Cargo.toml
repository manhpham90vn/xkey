[package]
name = "xkey"
version = "1.0.0"
edition = "2024"
repository = "https://github.com/manhpham90vn/xkey"
description = "A lightweight Vietnamese Telex input method for Linux (IBus), macOS (InputMethodKit), and Windows (keyboard hook)"
license = "MIT"


[dependencies]
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
zbus = { version = "4", features = ["tokio"] }
zvariant = "4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSRange"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSResponder"] }
objc2-input-method-kit = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
] }
ctrlc = "3"

[package.metadata.deb]
name = "xkey"
maintainer = "Manh Pham <h3x4r@yahoo.com>"
copyright = "2026, Manh Pham <h3x4r@yahoo.com>"
license-file = ["LICENSE", "0"]
depends = "ibus, libc6 (>= 2.31), libdbus-1-3 (>= 1.12.18)"
section = "utils"
priority = "optional"
assets = [
    ["target/release/xkey", "/usr/libexec/ibus-engine-xkey", "755"],
    ["linux/xkey.xml", "/usr/share/ibus/component/xkey.xml", "644"],
]
extended-description = """
XKey is a lightweight Vietnamese Telex input method for Linux (IBus), macOS (InputMethodKit), and Windows (keyboard hook).
It supports standard Telex rules and smart tone placement.
"""