[package]
name = "xkey"
version = "0.9.0"
edition = "2024"
repository = "https://github.com/manhpham90vn/xkey"
description = "A lightweight Vietnamese Telex input method for Linux (IBus) and macOS (InputMethodKit)"
license = "MIT"

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
zbus = { version = "4", features = ["tokio"] }
zvariant = "4"

# No specific dependencies needed for the macOS Rust staticlib as we handle FFI manually
[target.'cfg(target_os = "macos")'.dependencies]

[package.metadata.deb]
name = "xkey"
maintainer = "Manh Pham <h3x4r@yahoo.com>"
copyright = "2026, Manh Pham <h3x4r@yahoo.com>"
license-file = ["LICENSE", "0"]
depends = "ibus, libc6 (>= 2.31), libdbus-1-3 (>= 1.12.18)"
section = "utils"
priority = "optional"
assets = [
    ["target/release/xkey", "/usr/libexec/ibus-engine-xkey", "755"],
    ["linux/xkey.xml", "/usr/share/ibus/component/xkey.xml", "644"],
]
extended-description = """
XKey is a lightweight Vietnamese Telex input method for Linux (IBus) and macOS (InputMethodKit).
It supports standard Telex rules and smart tone placement.
"""