name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-linux:
    name: Release Binary (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build Release
        run: cargo build --release
      - name: Install cargo-deb
        run: cargo install cargo-deb
      - name: Build Deb Package
        run: cargo deb
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/xkey dist/xkey-linux
          cp target/debian/*.deb dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  release-macos:
    name: Release Binary (macOS)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: cargo build --release
      - name: Create app bundle
        run: |
          mkdir -p XKey.app/Contents/MacOS
          mkdir -p XKey.app/Contents/Resources
          cp target/release/xkey XKey.app/Contents/MacOS/xkey
          cp macos/Info.plist XKey.app/Contents/Info.plist
          echo -n "APPL????" > XKey.app/Contents/PkgInfo
      - name: Create zip
        run: zip -r xkey-macos.zip XKey.app
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: xkey-macos.zip

  create-release:
    name: Create Release
    needs: [release-linux, release-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist-linux
      - uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: dist-macos
      - name: List artifacts
        run: |
          echo "=== Linux ==="
          ls -la dist-linux/
          echo "=== macOS ==="
          ls -la dist-macos/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-linux/*
            dist-macos/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
